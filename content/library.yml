# Collections group entries on the page. `hue` is the colour angle (0 to 360) each one is drawn in.
collections:
  - id: motion
    name: Motion
    hue: 285
    description: Decide what should move, build it, then review it.
  - id: stories
    name: Stories and tours
    hue: 235
    description: Scroll-driven product films and guided walkthroughs.
  - id: gsap
    name: GSAP
    hue: 150
    description: Reference for timelines, ScrollTrigger and plugins.
  - id: interface
    name: Interface
    hue: 55
    description: Components, libraries and layouts for building screens.
  - id: native
    name: Native
    hue: 15
    description: Swift, Expo and making the web feel right on a phone.
  - id: working
    name: Ways of working
    hue: 195
    description: Prompts and agent files that shape how an agent behaves in a repo.
  - id: pstack
    name: pstack
    hue: 330
    description: poteto's engineering workflows and principles, from Cursor's plugin. Open it for the setup guide.

# Shown under the search field. Clicking one runs it.
examples:
  - walk new users through the UI
  - make this feel less janky
  - show how an order moves through our services
  - hand a task to another agent
  - add a toast
  - tear this diff apart

