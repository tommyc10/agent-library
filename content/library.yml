# Collections group entries on the page. `hue` is the colour angle (0 to 360) each one is drawn in.
collections:
  - id: motion
    name: Motion
    hue: 285
    description: Decide what should move, build it, then review it.
  - id: stories
    name: Stories and tours
    hue: 235
    description: Scroll-driven product films and guided walkthroughs.
  - id: gsap
    name: GSAP
    hue: 150
    description: Reference for timelines, ScrollTrigger and plugins.
  - id: interface
    name: Interface
    hue: 55
    description: Components, libraries and layouts for building screens.
  - id: native
    name: Native
    hue: 15
    description: Swift, Expo and making the web feel right on a phone.
  - id: working
    name: Ways of working
    hue: 195
    description: Prompts and agent files that shape how an agent behaves in a repo.

# Shown under the search field. Clicking one runs it.
examples:
  - walk new users through the UI
  - make this feel less janky
  - show how an order moves through our services
  - hand a task to another agent
  - add a toast

# Where each skill sits and which preview its tile draws. A skill with no preview gets `blocks`.
# Previews, each drawn in src/styles/previews.css:
#   curve, review, rank, scan, lookup, press, beam, scroll, spotlight, spotlight-lite,
#   tween, timeline, trigger, morph, orbit, stagger, meter, slider, form, pick, blocks,
#   variants, phone, phone-tabs, phone-swipe, code.
skills:
  animate: { collection: motion, preview: curve, tags: [build] }
  review-animations: { collection: motion, preview: review, tags: [review] }
  improve-animations: { collection: motion, preview: rank, tags: [audit] }
  find-animation-opportunities: { collection: motion, preview: scan, tags: [audit] }
  animation-vocabulary: { collection: motion, preview: lookup, tags: [reference] }
  emil-design-eng: { collection: motion, preview: press, tags: [polish] }
  apple-design: { collection: motion, preview: phone, tags: [gestures, polish] }
  libraries-dev: { collection: motion, preview: beam, tags: [effects] }
  scroll-story: { collection: stories, preview: scroll, tags: [authored, film] }
  tour: { collection: stories, preview: spotlight, tags: [authored, onboarding] }
  tour-lite: { collection: stories, preview: spotlight-lite, tags: [authored, onboarding] }
  gsap-core: { collection: gsap, preview: tween, tags: [reference] }
  gsap-timeline: { collection: gsap, preview: timeline, tags: [reference] }
  gsap-scrolltrigger: { collection: gsap, preview: trigger, tags: [reference] }
  gsap-plugins: { collection: gsap, preview: morph, tags: [reference] }
  gsap-react: { collection: gsap, preview: orbit, tags: [reference] }
  gsap-frameworks: { collection: gsap, preview: stagger, tags: [reference] }
  gsap-performance: { collection: gsap, preview: meter, tags: [reference] }
  gsap-utils: { collection: gsap, preview: slider, tags: [reference] }
  shadcn: { collection: interface, preview: form, tags: [components] }
  pick-ui-library: { collection: interface, preview: pick, tags: [components] }
  ask-sonner: { collection: interface, preview: blocks, tags: [toasts] }
  prototype: { collection: interface, preview: variants, tags: [explore] }
  mobile-native: { collection: native, preview: phone-tabs, tags: [web] }
  animate-expo: { collection: native, preview: phone-swipe, tags: [build] }
  write-swift: { collection: native, preview: code, tags: [swift] }
